<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zimbra — Documentation technique</title>
    <meta name="description" content="Tutoriel Zimbra — prérequis, installation, DNS, ports, SSL, tests." />
    <style>
      :root {
        --zm-primary: #ff8a00;
        --zm-accent: #ffb020;
        --zm-dark: #0d1b2a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", "Helvetica Neue", system-ui, -apple-system, Arial, sans-serif;
        background: var(--zm-dark);
        color: #fff;
      }

      button {
        font-family: inherit;
      }

      .app {
        min-height: 100vh;
      }

      .cover {
        min-height: 100vh;
        background: linear-gradient(135deg, var(--zm-dark) 0%, #0a1628 40%, #142c41 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
        padding: 0 24px;
      }

      .grid {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(rgba(255, 138, 0, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 138, 0, 0.06) 1px, transparent 1px);
        background-size: 44px 44px;
        pointer-events: none;
      }

      .orb {
        position: absolute;
        top: 18%;
        left: 50%;
        transform: translateX(-50%);
        width: 520px;
        height: 520px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(255, 138, 0, 0.13) 0%, transparent 70%);
        pointer-events: none;
      }

      .cover-inner {
        position: relative;
        z-index: 1;
        text-align: center;
        max-width: 820px;
        width: 100%;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        background: rgba(255, 138, 0, 0.1);
        border: 1px solid rgba(255, 138, 0, 0.3);
        border-radius: 12px;
        padding: 10px 24px;
        margin-bottom: 40px;
        backdrop-filter: blur(6px);
      }

      .badge span:last-child {
        color: var(--zm-accent);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
      }

      .title {
        font-size: clamp(62px, 9vw, 94px);
        font-weight: 900;
        letter-spacing: -4px;
        background: linear-gradient(135deg, #fff 0%, var(--zm-accent) 55%, var(--zm-primary) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0 0 8px;
        line-height: 1;
      }

      .sub {
        color: rgba(255, 255, 255, 0.4);
        font-size: 13px;
        letter-spacing: 6px;
        text-transform: uppercase;
        margin-bottom: 32px;
      }

      .desc {
        color: rgba(255, 255, 255, 0.7);
        font-size: 18px;
        line-height: 1.7;
        max-width: 680px;
        margin: 0 auto 48px;
      }

      .pill-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        margin-bottom: 56px;
      }

      .pill {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 6px 16px;
        color: rgba(255, 255, 255, 0.6);
        font-size: 12px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        user-select: none;
        cursor: pointer;
        appearance: none;
        -webkit-appearance: none;
        outline: none;
      }

      .pill:hover {
        background: rgba(255, 255, 255, 0.09);
        border-color: rgba(255, 176, 32, 0.35);
        color: rgba(255, 255, 255, 0.82);
      }

      .primary-btn {
        background: linear-gradient(135deg, var(--zm-primary), var(--zm-accent));
        color: #000;
        font-weight: 800;
        font-size: 15px;
        border: none;
        border-radius: 12px;
        padding: 16px 48px;
        cursor: pointer;
        letter-spacing: 1px;
        text-transform: uppercase;
        box-shadow: 0 0 44px rgba(255, 138, 0, 0.38);
        transition: transform 0.2s, box-shadow 0.2s;
      }

      .primary-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 0 70px rgba(255, 138, 0, 0.6);
      }

      .tiny {
        margin-top: 20px;
        color: rgba(255, 255, 255, 0.25);
        font-size: 12px;
      }

      .tutorial {
        min-height: 100vh;
        display: flex;
        background: var(--zm-dark);
      }

      .sidebar {
        width: 300px;
        flex-shrink: 0;
        background: #091422;
        border-right: 1px solid rgba(255, 138, 0, 0.14);
        display: flex;
        flex-direction: column;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
      }

      .sidebar-header {
        padding: 24px 20px;
        border-bottom: 1px solid rgba(255, 138, 0, 0.14);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .logo-badge {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--zm-primary), var(--zm-accent));
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        color: #000;
        font-size: 14px;
      }

      .logo-text {
        color: #fff;
        font-weight: 800;
        font-size: 18px;
      }

      .ghost-btn {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.5);
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
        font-size: 11px;
        white-space: nowrap;
      }

      .nav {
        padding: 16px 12px;
        flex: 1;
      }

      .nav-label {
        color: rgba(255, 255, 255, 0.3);
        font-size: 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
        padding: 0 8px 12px;
      }

      .nav-item {
        width: 100%;
        text-align: left;
        border: none;
        border-radius: 8px;
        padding: 10px 12px;
        cursor: pointer;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 10px;
        background: transparent;
        border-left: 3px solid transparent;
        color: rgba(255, 255, 255, 0.55);
        font-size: 13px;
        transition: background 0.15s;
      }

      .nav-item:hover {
        background: rgba(255, 255, 255, 0.04);
      }

      .nav-item.active {
        background: rgba(255, 138, 0, 0.16);
        border-left-color: var(--zm-accent);
        color: #fff;
        font-weight: 650;
      }

      .dot {
        margin-left: auto;
        color: var(--zm-accent);
        font-size: 10px;
      }

      .progress {
        padding: 16px 20px;
        border-top: 1px solid rgba(255, 138, 0, 0.14);
      }

      .progress-text {
        color: rgba(255, 255, 255, 0.3);
        font-size: 10px;
        margin-bottom: 8px;
      }

      .progress-bar {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 4px;
        height: 4px;
        overflow: hidden;
      }

      .progress-bar > div {
        height: 100%;
        border-radius: 4px;
        background: linear-gradient(90deg, var(--zm-primary), var(--zm-accent));
        transition: width 0.3s;
      }

      .content {
        flex: 1;
        overflow-y: auto;
        padding: 40px 48px;
        max-width: 980px;
        width: 100%;
      }

      .chapter-header {
        margin-bottom: 40px;
      }

      .chapter-top {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 16px;
      }

      .chapter-icon {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        background: rgba(255, 138, 0, 0.1);
        border: 1px solid rgba(255, 138, 0, 0.26);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
      }

      .chapter-kicker {
        color: var(--zm-accent);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 4px;
      }

      .chapter-title {
        color: #fff;
        font-size: 28px;
        font-weight: 850;
        margin: 0;
        letter-spacing: -0.5px;
      }

      .chapter-sep {
        height: 1px;
        background: linear-gradient(90deg, rgba(255, 138, 0, 0.48), transparent);
      }

      .block-intro {
        background: rgba(255, 138, 0, 0.07);
        border: 1px solid rgba(255, 138, 0, 0.2);
        border-radius: 12px;
        padding: 20px 24px;
        margin-bottom: 24px;
        color: rgba(255, 255, 255, 0.82);
        font-size: 15px;
        line-height: 1.85;
      }

      .block-h3 {
        color: #fff;
        font-size: 15px;
        font-weight: 750;
        margin: 0 0 14px;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .feature-item {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 8px;
        padding: 10px 14px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.72);
        font-size: 13px;
      }

      .check {
        color: var(--zm-accent);
        font-size: 12px;
        margin-top: 2px;
        flex-shrink: 0;
      }

      .info {
        background: rgba(255, 193, 7, 0.08);
        border: 1px solid rgba(255, 193, 7, 0.25);
        border-radius: 12px;
        padding: 18px 22px;
        margin-bottom: 28px;
      }

      .info-title {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        color: #ffc107;
        font-weight: 700;
        font-size: 14px;
      }

      .info-item {
        display: flex;
        gap: 10px;
        margin-bottom: 6px;
        color: rgba(255, 255, 255, 0.78);
        font-size: 13px;
      }

      .info-dot {
        color: #ffc107;
        font-size: 12px;
      }

      .step {
        margin-bottom: 28px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 14px;
        overflow: hidden;
      }

      .step-head {
        padding: 14px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        background: rgba(255, 138, 0, 0.06);
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .step-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--zm-accent);
        flex-shrink: 0;
      }

      .step-title {
        margin: 0;
        color: #fff;
        font-size: 14px;
        font-weight: 750;
      }

      .step-body {
        padding: 16px 20px;
      }

      .step-text {
        color: rgba(255, 255, 255, 0.68);
        font-size: 13.5px;
        line-height: 1.75;
        margin: 0 0 14px;
      }

      .cmd {
        background: #060e18;
        border: 1px solid rgba(255, 138, 0, 0.18);
        border-radius: 8px;
        padding: 10px 16px;
        margin-bottom: 8px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        font-size: 12.5px;
        color: var(--zm-accent);
        overflow-x: auto;
        white-space: nowrap;
      }

      .cmd-hash {
        color: rgba(255, 176, 32, 0.45);
        margin-right: 8px;
      }

      .note {
        margin-top: 12px;
        background: rgba(255, 255, 255, 0.04);
        border-left: 3px solid rgba(255, 176, 32, 0.46);
        border-radius: 0 8px 8px 0;
        padding: 12px 16px;
      }

      .note-kicker {
        color: var(--zm-accent);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 6px;
      }

      .note pre {
        color: rgba(255, 255, 255, 0.6);
        font-size: 12.5px;
        line-height: 1.7;
        margin: 0;
        white-space: pre-wrap;
        font-family: inherit;
      }

      .nav-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 56px;
        padding-top: 24px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }

      .navbtn {
        padding: 12px 28px;
        border-radius: 10px;
        font-weight: 650;
        font-size: 14px;
        border: 1px solid rgba(255, 176, 32, 0.32);
        background: rgba(255, 176, 32, 0.08);
        color: var(--zm-accent);
        cursor: pointer;
        transition: opacity 0.2s;
      }

      .navbtn.primary {
        border: none;
        background: linear-gradient(135deg, var(--zm-primary), var(--zm-accent));
        color: #000;
      }

      .navbtn:disabled {
        cursor: not-allowed;
        opacity: 0.35;
        background: rgba(255, 255, 255, 0.04);
        border-color: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.35);
      }

      @media (max-width: 980px) {
        .sidebar {
          width: 250px;
        }
        .content {
          padding: 32px 24px;
        }
      }

      @media (max-width: 820px) {
        .tutorial {
          flex-direction: column;
        }
        .sidebar {
          position: relative;
          width: 100%;
          height: auto;
        }
        .grid-2 {
          grid-template-columns: 1fr;
        }
        .content {
          max-width: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" class="app"></div>

    <script>
      const chapters = [
        {
          id: 0,
          title: "Introduction",
          icon: "📨",
          content: [
            {
              type: "intro",
              text:
                "Zimbra Collaboration est une solution de messagerie et de collaboration (mail, calendrier, contacts) souvent déployée en entreprise. Ce guide résume un déploiement type en VM (DNS OK, IP fixe), avec les points qui bloquent le plus souvent (hostname/FQDN, enregistrements DNS, ports, SSL).",
            },
            {
              type: "features",
              title: "Pré-requis indispensables",
              items: [
                "IP fixe + passerelle + DNS fonctionnel",
                "Nom de machine en FQDN (ex: mail.stadiumcompany.com)",
                "Résolution directe et inverse (A + PTR) recommandée",
                "Ports ouverts (25/465/587/110/143/993/995/443/7071… selon besoins)",
                "Serveur dédié (éviter d'installer d'autres services lourds sur la même VM)",
              ],
            },
          ],
        },
        {
          id: 1,
          title: "Réseau & identité",
          icon: "🌐",
          content: [
            {
              type: "step",
              title: "a. Fixer hostname + FQDN",
              text:
                "Le plus important : le nom doit être cohérent partout (hostname, /etc/hosts, DNS). Exemple ci-dessous avec mail.stadiumcompany.com.",
              commands: ["hostnamectl set-hostname mail.stadiumcompany.com", "hostname -f"],
              note:
                "Astuce: si ton domaine est différent, remplace stadiumcompany.com.\nLe FQDN doit être stable, sinon l'installation Zimbra échoue.",
            },
            {
              type: "step",
              title: "b. Vérifier /etc/hosts",
              commands: ["nano /etc/hosts"],
              note:
                "Exemple:\n127.0.0.1 localhost\n172.20.0.15 mail.stadiumcompany.com mail\n\nÉvite de mettre le FQDN sur 127.0.1.1 pour Zimbra.",
            },
            {
              type: "step",
              title: "c. Vérifier DNS (A / MX / PTR si possible)",
              commands: ["dig A mail.stadiumcompany.com", "dig MX stadiumcompany.com", "dig -x 172.20.0.15"],
              note:
                "Minimum: A (mail → IP) et MX (domaine → mail).\nPTR (reverse) est fortement recommandé en prod (anti-spam).",
            },
          ],
        },
        {
          id: 2,
          title: "Pré-requis système",
          icon: "⚙️",
          content: [
            { type: "step", title: "a. Mise à jour OS", commands: ["apt update && apt upgrade -y"] },
            {
              type: "step",
              title: "b. Paquets utiles",
              text: "Selon ta distro, Zimbra installe aussi des dépendances, mais ces outils aident au diag (DNS, net, unzip…).",
              commands: ["apt install -y unzip net-tools dnsutils perl wget curl lsof"],
            },
            {
              type: "info",
              title: "Points de vigilance",
              items: [
                "RAM/CPU: vise au minimum 4–8 Go RAM pour un lab confortable",
                "Horloge/NTP: une dérive d'heure casse souvent TLS + auth (utilise chrony)",
                "Pas de proxy transparent/DNS cassé",
              ],
            },
          ],
        },
        {
          id: 3,
          title: "Installation Zimbra",
          icon: "📦",
          content: [
            {
              type: "step",
              title: "a. Télécharger l'archive",
              commands: ["cd /tmp", "wget -O zimbra.tgz <URL_ZIMBRA_TGZ>", "tar xzf zimbra.tgz"],
              note:
                "Remplace <URL_ZIMBRA_TGZ> par le lien exact fourni par Zimbra (version/OS).\nTu peux aussi déposer le .tgz dans /tmp puis le décompresser.",
            },
            {
              type: "step",
              title: "b. Lancer l'installateur",
              commands: ["cd zcs-*", "./install.sh"],
              note:
                "Lis bien les prompts.\nLes erreurs les plus fréquentes viennent du FQDN/DNS (chapitre 2).",
            },
            {
              type: "step",
              title: "c. Finaliser la configuration",
              text:
                "À la fin, tu passes dans le menu de configuration (mot de passe admin, domaine, services).",
              commands: ["su - zimbra", "zmcontrol status"],
            },
          ],
        },
        {
          id: 4,
          title: "Pare-feu & ports",
          icon: "🧱",
          content: [
            {
              type: "step",
              title: "a. Vérifier les ports en écoute",
              commands: ["ss -lntp | head", "ss -lntp | grep -E ':(25|465|587|110|143|443|993|995|7071)\\b' || true"],
            },
            {
              type: "step",
              title: "b. UFW (si activé)",
              commands: ["ufw status", "ufw allow 25,80,110,143,443,465,587,993,995,7071/tcp"],
              note:
                "Adapte selon ce que tu utilises.\n7071 = console admin (HTTPS) — à restreindre en prod (ACL/VPN).",
            },
          ],
        },
        {
          id: 5,
          title: "Accès & tests",
          icon: "✅",
          content: [
            {
              type: "step",
              title: "a. Console admin & webmail",
              commands: ["https://mail.stadiumcompany.com:7071", "https://mail.stadiumcompany.com"],
              note:
                "Console admin: port 7071.\nWebmail: port 443.\nSi tu n'as pas de DNS côté client, teste avec l'IP + entrée hosts.",
            },
            {
              type: "step",
              title: "b. Tests SMTP/IMAPS rapides",
              commands: ["openssl s_client -connect mail.stadiumcompany.com:465 -crlf", "openssl s_client -connect mail.stadiumcompany.com:993 -crlf"],
              note:
                "Tu dois voir un certificat et une bannière.\nEn lab, les certificats peuvent être auto-signés.",
            },
            {
              type: "info",
              title: "Commandes Zimbra utiles",
              items: [
                "zmcontrol status — état des services",
                "zmprov gaa — liste des comptes",
                "zmprov ca user@domaine.tld 'MotDePasse!' — créer un compte",
                "tail -f /var/log/zimbra.log — logs mail",
              ],
            },
          ],
        },
      ];

      const state = { page: "cover", active: 0 };
      const app = document.getElementById("app");

      function el(tag, attrs = {}, children = []) {
        const node = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (v === null || v === undefined) continue;
          if (k === "class") node.className = v;
          else if (k === "text") node.textContent = v;
          else if (k === "disabled") node.disabled = Boolean(v);
          else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
          else node.setAttribute(k, v);
        }
        for (const child of children) node.appendChild(child);
        return node;
      }

      function render() {
        app.innerHTML = "";
        if (state.page === "cover") app.appendChild(renderCover());
        else app.appendChild(renderTutorial());
        window.scrollTo({ top: 0, behavior: "instant" });
      }

      function renderCover() {
        const inner = el("div", { class: "cover-inner" }, [
          el("div", { class: "badge" }, [el("span", { text: "📨" }), el("span", { text: "Documentation Technique" })]),
          el("h1", { class: "title", text: "Zimbra" }),
          el("div", { class: "sub", text: "Messagerie & Collaboration" }),
          el("div", {
            class: "desc",
            text: "Guide d'installation et de mise en service — DNS/FQDN, services, ports, tests rapides.",
          }),
          renderCoverPills(),
          el(
            "button",
            {
              class: "primary-btn",
              text: "Commencer le tutoriel →",
              onclick: () => {
                state.page = "tutorial";
                render();
              },
            },
            []
          ),
          el("div", { class: "tiny", text: `${chapters.length} chapitres · Checklist de mise en service` }),
        ]);

        return el("div", { class: "cover" }, [el("div", { class: "grid" }), el("div", { class: "orb" }), inner]);
      }

      function renderCoverPills() {
        const row = el("div", { class: "pill-row" }, []);
        for (const ch of chapters) {
          row.appendChild(
            el(
              "button",
              {
                class: "pill",
                type: "button",
                "aria-label": `Ouvrir le chapitre ${ch.title}`,
                onclick: () => {
                  state.page = "tutorial";
                  state.active = ch.id;
                  render();
                },
              },
              [el("span", { text: ch.icon }), el("span", { text: ch.title })]
            )
          );
        }
        return row;
      }

      function renderTutorial() {
        const sidebar = el("div", { class: "sidebar" }, [renderSidebarHeader(), renderNav(), renderProgress()]);
        const content = el("div", { class: "content" }, [renderChapterHeader(), ...renderBlocks(), renderNavButtons()]);
        return el("div", { class: "tutorial" }, [sidebar, content]);
      }

      function renderSidebarHeader() {
        return el("div", { class: "sidebar-header" }, [
          el("div", { class: "logo" }, [el("div", { class: "logo-badge", text: "Z" }), el("div", { class: "logo-text", text: "Zimbra" })]),
          el("button", {
            class: "ghost-btn",
            text: "← Accueil",
            onclick: () => {
              state.page = "cover";
              render();
            },
          }),
        ]);
      }

      function renderNav() {
        const nav = el("div", { class: "nav" }, [el("div", { class: "nav-label", text: "Chapitres" })]);
        for (const ch of chapters) {
          const btn = el(
            "button",
            {
              class: `nav-item ${state.active === ch.id ? "active" : ""}`,
              onclick: () => {
                state.active = ch.id;
                render();
              },
            },
            [el("span", { text: ch.icon }), el("span", { text: ch.title })]
          );
          if (state.active === ch.id) btn.appendChild(el("span", { class: "dot", text: "●" }));
          nav.appendChild(btn);
        }
        return el("nav", {}, [nav]);
      }

      function renderProgress() {
        const pct = ((state.active + 1) / chapters.length) * 100;
        return el("div", { class: "progress" }, [
          el("div", { class: "progress-text", text: `PROGRESSION — ${state.active + 1}/${chapters.length}` }),
          el("div", { class: "progress-bar" }, [el("div", { style: `width:${pct}%` })]),
        ]);
      }

      function renderChapterHeader() {
        const chapter = chapters[state.active];
        return el("div", { class: "chapter-header" }, [
          el("div", { class: "chapter-top" }, [
            el("div", { class: "chapter-icon", text: chapter.icon }),
            el("div", {}, [
              el("div", { class: "chapter-kicker", text: `Chapitre ${state.active + 1}` }),
              el("h2", { class: "chapter-title", text: chapter.title }),
            ]),
          ]),
          el("div", { class: "chapter-sep" }),
        ]);
      }

      function renderBlocks() {
        const chapter = chapters[state.active];
        const blocks = [];
        for (const block of chapter.content) {
          if (block.type === "intro") blocks.push(el("div", { class: "block-intro", text: block.text }));
          else if (block.type === "features") blocks.push(renderFeatures(block));
          else if (block.type === "info") blocks.push(renderInfo(block));
          else if (block.type === "step") blocks.push(renderStep(block));
        }
        return blocks;
      }

      function renderFeatures(block) {
        const grid = el("div", { class: "grid-2" }, []);
        for (const item of block.items) {
          grid.appendChild(el("div", { class: "feature-item" }, [el("span", { class: "check", text: "✓" }), el("span", { text: item })]));
        }
        return el("div", { style: "margin-bottom:28px" }, [el("div", { class: "block-h3", text: block.title }), grid]);
      }

      function renderInfo(block) {
        const box = el("div", { class: "info" }, [
          el("div", { class: "info-title" }, [el("span", { text: "ℹ️" }), el("span", { text: block.title })]),
        ]);
        for (const item of block.items) {
          box.appendChild(el("div", { class: "info-item" }, [el("span", { class: "info-dot", text: "•" }), el("span", { text: item })]));
        }
        return box;
      }

      function renderStep(block) {
        const wrap = el("div", { class: "step" }, [
          el("div", { class: "step-head" }, [el("div", { class: "step-dot" }), el("h3", { class: "step-title", text: block.title })]),
        ]);
        const body = el("div", { class: "step-body" }, []);
        if (block.text) body.appendChild(el("p", { class: "step-text", text: block.text }));
        if (block.commands) {
          for (const cmd of block.commands) {
            const cmdRow = el("div", { class: "cmd" }, [el("span", { class: "cmd-hash", text: "#" }), el("span", { text: cmd })]);
            body.appendChild(cmdRow);
          }
        }
        if (block.note) {
          body.appendChild(el("div", { class: "note" }, [el("div", { class: "note-kicker", text: "Note" }), el("pre", { text: block.note })]));
        }
        wrap.appendChild(body);
        return wrap;
      }

      function renderNavButtons() {
        const prev = el("button", {
          class: "navbtn",
          text: "← Précédent",
          disabled: state.active === 0,
          onclick: () => {
            if (state.active === 0) return;
            state.active = Math.max(0, state.active - 1);
            render();
          },
        });

        const next = el("button", {
          class: "navbtn primary",
          text: "Suivant →",
          disabled: state.active === chapters.length - 1,
          onclick: () => {
            if (state.active === chapters.length - 1) return;
            state.active = Math.min(chapters.length - 1, state.active + 1);
            render();
          },
        });

        return el("div", { class: "nav-buttons" }, [prev, next]);
      }

      render();
    </script>
  </body>
</html>
