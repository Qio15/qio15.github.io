<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Contact - Portfolio BTS SIO" />
    <title>Portfolio BTS SIO | Contact</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
      <div class="container">
        <a class="navbar-brand" href="index.html">Portfolio / Mathias</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mainNav"
          aria-controls="mainNav"
          aria-expanded="false"
          aria-label="Ouvrir le menu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto gap-1">
            <li class="nav-item"><a class="nav-link" data-nav href="index.html">Accueil</a></li>
            <li class="nav-item"><a class="nav-link" data-nav href="presentation.html">Présentation</a></li>
            <li class="nav-item"><a class="nav-link" data-nav href="epreuve-e5.html">E5</a></li>
            <li class="nav-item"><a class="nav-link" data-nav href="epreuve-e6.html">E6</a></li>
            <li class="nav-item"><a class="nav-link" data-nav href="competences.html">Compétences</a></li>
            <li class="nav-item"><a class="nav-link" data-nav href="veille-technologique.html">Veille technologique</a></li>
            <li class="nav-item"><a class="nav-link" data-nav href="contact.html">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container my-4">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5 reveal">
          <div class="contact-panel">
            <form id="contactForm" class="contact-form" novalidate>
              <div class="mb-4">
                <label for="nom" class="contact-label">Nom</label>
                <input
                  type="text"
                  class="contact-input form-control"
                  id="nom"
                  name="nom"
                  autocomplete="name"
                  required
                />
              </div>

              <div class="mb-4">
                <label for="email" class="contact-label">Email</label>
                <input
                  type="email"
                  class="contact-input form-control"
                  id="email"
                  name="email"
                  autocomplete="email"
                  required
                />
              </div>

              <div class="mb-4">
                <label for="message" class="contact-label">Message</label>
                <textarea
                  class="contact-input form-control"
                  id="message"
                  name="message"
                  rows="6"
                  required
                ></textarea>
              </div>

              <button type="submit" class="btn btn-primary w-100 contact-submit">Envoyer</button>
            </form>
          </div>

          <p class="text-muted text-center small mt-4 mb-0">
            Ou écris-moi directement :
            <a class="link-light" href="mailto:mathiasparis.pro@gmail.com">mathiasparis.pro@gmail.com</a>
          </p>
        </div>
      </div>
    </main>

    <footer class="mt-4 py-4">
      <div class="container d-flex flex-column flex-md-row gap-2 align-items-md-center justify-content-between">
        <div class="text-muted">© <span id="year"></span> Mathias Paris — Portfolio BTS SIO</div>
        <div class="text-muted">
          <a class="link-light" href="index.html">Accueil</a>
          <span class="mx-2">•</span>
          <a class="link-light" href="mentions-legales.html">Mentions légales</a>
        </div>
      </div>
    </footer>

    <button id="backToTop" class="btn btn-primary back-to-top" type="button" aria-label="Retour en haut">
      ↑
    </button>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();

      document.getElementById("contactForm").addEventListener("submit", function (e) {
        e.preventDefault();
        const nom = document.getElementById("nom").value.trim();
        const email = document.getElementById("email").value.trim();
        const message = document.getElementById("message").value.trim();

        if (!nom || !email || !message) return;

        const subject = encodeURIComponent("Contact portfolio — " + nom);
        const body = encodeURIComponent(
          "Nom : " + nom + "\nEmail : " + email + "\n\n" + message
        );
        window.location.href =
          "mailto:mathiasparis.pro@gmail.com?subject=" + subject + "&body=" + body;
      });
    </script>
  </body>
</html>
