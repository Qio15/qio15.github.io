<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GLPI — Documentation technique</title>
    <meta name="description" content="Tutoriel GLPI — installation, configuration, sécurisation." />
    <style>
      :root {
        --glpi-blue: #00bcd4;
        --glpi-accent: #00e5ff;
        --glpi-dark: #0d1b2a;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", "Helvetica Neue", system-ui, -apple-system, Arial, sans-serif;
        background: var(--glpi-dark);
        color: #fff;
      }

      button {
        font-family: inherit;
      }

      /* Layout */
      .app {
        min-height: 100vh;
      }

      .cover {
        min-height: 100vh;
        background: linear-gradient(135deg, var(--glpi-dark) 0%, #0a1628 40%, #0d2137 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
        padding: 0 24px;
      }

      .grid {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(rgba(0, 188, 212, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 188, 212, 0.05) 1px, transparent 1px);
        background-size: 40px 40px;
        pointer-events: none;
      }

      .orb {
        position: absolute;
        top: 20%;
        left: 50%;
        transform: translateX(-50%);
        width: 500px;
        height: 500px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(0, 188, 212, 0.12) 0%, transparent 70%);
        pointer-events: none;
      }

      .cover-inner {
        position: relative;
        z-index: 1;
        text-align: center;
        max-width: 760px;
        width: 100%;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        background: rgba(0, 188, 212, 0.1);
        border: 1px solid rgba(0, 188, 212, 0.3);
        border-radius: 12px;
        padding: 10px 24px;
        margin-bottom: 40px;
        backdrop-filter: blur(6px);
      }

      .badge span:last-child {
        color: var(--glpi-accent);
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 3px;
        text-transform: uppercase;
      }

      .glpi-title {
        font-size: clamp(64px, 9vw, 96px);
        font-weight: 900;
        letter-spacing: -4px;
        background: linear-gradient(135deg, #fff 0%, var(--glpi-accent) 60%, var(--glpi-blue) 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0 0 8px;
        line-height: 1;
      }

      .glpi-sub {
        color: rgba(255, 255, 255, 0.4);
        font-size: 13px;
        letter-spacing: 6px;
        text-transform: uppercase;
        margin-bottom: 32px;
      }

      .glpi-desc {
        color: rgba(255, 255, 255, 0.7);
        font-size: 18px;
        line-height: 1.7;
        max-width: 620px;
        margin: 0 auto 48px;
      }

      .pill-row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        justify-content: center;
        margin-bottom: 56px;
      }

      .pill {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 20px;
        padding: 6px 16px;
        color: rgba(255, 255, 255, 0.6);
        font-size: 12px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        user-select: none;
      }

      .primary-btn {
        background: linear-gradient(135deg, var(--glpi-blue), var(--glpi-accent));
        color: #000;
        font-weight: 800;
        font-size: 15px;
        border: none;
        border-radius: 12px;
        padding: 16px 48px;
        cursor: pointer;
        letter-spacing: 1px;
        text-transform: uppercase;
        box-shadow: 0 0 40px rgba(0, 188, 212, 0.4);
        transition: transform 0.2s, box-shadow 0.2s;
      }

      .primary-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 0 60px rgba(0, 188, 212, 0.6);
      }

      .tiny {
        margin-top: 20px;
        color: rgba(255, 255, 255, 0.25);
        font-size: 12px;
      }

      .tutorial {
        min-height: 100vh;
        display: flex;
        background: var(--glpi-dark);
      }

      .sidebar {
        width: 280px;
        flex-shrink: 0;
        background: #091422;
        border-right: 1px solid rgba(0, 188, 212, 0.1);
        display: flex;
        flex-direction: column;
        position: sticky;
        top: 0;
        height: 100vh;
        overflow-y: auto;
      }

      .sidebar-header {
        padding: 24px 20px;
        border-bottom: 1px solid rgba(0, 188, 212, 0.1);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .logo-badge {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--glpi-blue), var(--glpi-accent));
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        color: #000;
        font-size: 14px;
      }

      .logo-text {
        color: #fff;
        font-weight: 800;
        font-size: 18px;
      }

      .ghost-btn {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.5);
        border-radius: 6px;
        padding: 6px 10px;
        cursor: pointer;
        font-size: 11px;
        white-space: nowrap;
      }

      .nav {
        padding: 16px 12px;
        flex: 1;
      }

      .nav-label {
        color: rgba(255, 255, 255, 0.3);
        font-size: 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
        padding: 0 8px 12px;
      }

      .nav-item {
        width: 100%;
        text-align: left;
        border: none;
        border-radius: 8px;
        padding: 10px 12px;
        cursor: pointer;
        margin-bottom: 4px;
        display: flex;
        align-items: center;
        gap: 10px;
        background: transparent;
        border-left: 3px solid transparent;
        color: rgba(255, 255, 255, 0.5);
        font-size: 13px;
        transition: background 0.15s;
      }

      .nav-item:hover {
        background: rgba(255, 255, 255, 0.04);
      }

      .nav-item.active {
        background: rgba(0, 188, 212, 0.15);
        border-left-color: var(--glpi-accent);
        color: #fff;
        font-weight: 600;
      }

      .dot {
        margin-left: auto;
        color: var(--glpi-accent);
        font-size: 10px;
      }

      .progress {
        padding: 16px 20px;
        border-top: 1px solid rgba(0, 188, 212, 0.1);
      }

      .progress-text {
        color: rgba(255, 255, 255, 0.3);
        font-size: 10px;
        margin-bottom: 8px;
      }

      .progress-bar {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 4px;
        height: 4px;
        overflow: hidden;
      }

      .progress-bar > div {
        height: 100%;
        border-radius: 4px;
        background: linear-gradient(90deg, var(--glpi-blue), var(--glpi-accent));
        transition: width 0.3s;
      }

      .content {
        flex: 1;
        overflow-y: auto;
        padding: 40px 48px;
        max-width: 920px;
        width: 100%;
      }

      .chapter-header {
        margin-bottom: 40px;
      }

      .chapter-top {
        display: flex;
        align-items: center;
        gap: 16px;
        margin-bottom: 16px;
      }

      .chapter-icon {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        background: rgba(0, 188, 212, 0.1);
        border: 1px solid rgba(0, 188, 212, 0.25);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
      }

      .chapter-kicker {
        color: var(--glpi-accent);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2px;
        text-transform: uppercase;
        margin-bottom: 4px;
      }

      .chapter-title {
        color: #fff;
        font-size: 28px;
        font-weight: 800;
        margin: 0;
        letter-spacing: -0.5px;
      }

      .chapter-sep {
        height: 1px;
        background: linear-gradient(90deg, rgba(0, 188, 212, 0.4), transparent);
      }

      .block-intro {
        background: rgba(0, 188, 212, 0.07);
        border: 1px solid rgba(0, 188, 212, 0.2);
        border-radius: 12px;
        padding: 20px 24px;
        margin-bottom: 24px;
        color: rgba(255, 255, 255, 0.8);
        font-size: 15px;
        line-height: 1.8;
      }

      .block-h3 {
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        margin: 0 0 14px;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      .feature-item {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 8px;
        padding: 10px 14px;
        border: 1px solid rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.7);
        font-size: 13px;
      }

      .check {
        color: var(--glpi-accent);
        font-size: 12px;
        margin-top: 2px;
        flex-shrink: 0;
      }

      .info {
        background: rgba(255, 193, 7, 0.08);
        border: 1px solid rgba(255, 193, 7, 0.25);
        border-radius: 12px;
        padding: 18px 22px;
        margin-bottom: 28px;
      }

      .info-title {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
        color: #ffc107;
        font-weight: 700;
        font-size: 14px;
      }

      .info-item {
        display: flex;
        gap: 10px;
        margin-bottom: 6px;
        color: rgba(255, 255, 255, 0.75);
        font-size: 13px;
      }

      .info-dot {
        color: #ffc107;
        font-size: 12px;
      }

      .step {
        margin-bottom: 28px;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 14px;
        overflow: hidden;
      }

      .step-head {
        padding: 14px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        background: rgba(0, 188, 212, 0.06);
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .step-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--glpi-accent);
        flex-shrink: 0;
      }

      .step-title {
        margin: 0;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
      }

      .step-body {
        padding: 16px 20px;
      }

      .step-text {
        color: rgba(255, 255, 255, 0.65);
        font-size: 13.5px;
        line-height: 1.7;
        margin: 0 0 14px;
      }

      .cmd {
        background: #060e18;
        border: 1px solid rgba(0, 188, 212, 0.15);
        border-radius: 8px;
        padding: 10px 16px;
        margin-bottom: 8px;
        font-family: "Courier New", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
        font-size: 12.5px;
        color: var(--glpi-accent);
        overflow-x: auto;
        white-space: nowrap;
      }

      .cmd-hash {
        color: rgba(0, 188, 212, 0.4);
        margin-right: 8px;
      }

      .note {
        margin-top: 12px;
        background: rgba(255, 255, 255, 0.04);
        border-left: 3px solid rgba(0, 188, 212, 0.4);
        border-radius: 0 8px 8px 0;
        padding: 12px 16px;
      }

      .note-kicker {
        color: var(--glpi-accent);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 6px;
      }

      .note pre {
        color: rgba(255, 255, 255, 0.6);
        font-size: 12.5px;
        line-height: 1.7;
        margin: 0;
        white-space: pre-wrap;
        font-family: inherit;
      }

      .nav-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 56px;
        padding-top: 24px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }

      .navbtn {
        padding: 12px 28px;
        border-radius: 10px;
        font-weight: 600;
        font-size: 14px;
        border: 1px solid rgba(0, 188, 212, 0.3);
        background: rgba(0, 188, 212, 0.08);
        color: var(--glpi-accent);
        cursor: pointer;
        transition: opacity 0.2s;
      }

      .navbtn.primary {
        border: none;
        background: linear-gradient(135deg, var(--glpi-blue), var(--glpi-accent));
        color: #000;
      }

      .navbtn:disabled {
        cursor: not-allowed;
        opacity: 0.35;
        background: rgba(255, 255, 255, 0.04);
        border-color: rgba(255, 255, 255, 0.08);
        color: rgba(255, 255, 255, 0.35);
      }

      @media (max-width: 980px) {
        .sidebar {
          width: 240px;
        }
        .content {
          padding: 32px 24px;
        }
      }

      @media (max-width: 820px) {
        .tutorial {
          flex-direction: column;
        }
        .sidebar {
          position: relative;
          width: 100%;
          height: auto;
        }
        .grid-2 {
          grid-template-columns: 1fr;
        }
        .content {
          max-width: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" class="app"></div>

    <script>
      const chapters = [
        {
          id: 0,
          title: "Introduction",
          icon: "📋",
          content: [
            {
              type: "intro",
              text: "GLPI est une solution open-source de gestion de parc informatique et de service desk. C'est une application Full Web pour gérer l'ensemble de vos problématiques de gestion de parc informatique.",
            },
            {
              type: "features",
              title: "Fonctionnalités clés",
              items: [
                "Gestion et suivi des ressources informatiques",
                "Gestion et suivi des licences",
                "Gestion et suivi des consommables",
                "Base de connaissances",
                "Gestion des réservations",
                "Service Desk (helpdesk, SLA...)",
                "Inventaire automatisé",
                "Télé-déploiement",
              ],
            },
            {
              type: "features",
              title: "Avantages",
              items: [
                "Réduction des coûts",
                "Optimisation des ressources",
                "Gestion rigoureuse des licences",
                "Démarche qualité",
                "Satisfaction utilisateur",
                "Sécurité",
                "Diffusé sous licence libre GPL — gratuit",
              ],
            },
          ],
        },
        {
          id: 1,
          title: "Serveur LAMP",
          icon: "🖥️",
          content: [
            { type: "step", title: "a. Mise à jour de la distribution", commands: ["apt update && apt upgrade"] },
            { type: "step", title: "b. Renommer la machine", commands: ["hostnamectl set-hostname glpi"] },
            {
              type: "step",
              title: "c. Configuration réseau",
              text: "Ajouter une carte réseau sur un LAN segment, garder l'autre en NAT pour l'accès Internet.",
              commands: ["vim /etc/network/interfaces"],
              note: "Configurer ens36 en static avec l'adresse IP du LAN, puis activer la carte : ifup ens36",
            },
            {
              type: "step",
              title: "d. Installation Apache2, PHP et MariaDB",
              commands: ["apt install apache2 php mariadb-server -y"],
              note: "Vérifier le bon fonctionnement d'Apache avec systemctl status apache2. Tester PHP en créant une page phpinfo.php.",
            },
            {
              type: "step",
              title: "e. Sécurisation MariaDB",
              commands: ["mysql_secure_installation"],
              note: `Répondre aux questions :
• Switch to unix_socket : N
• Change root password : Y (mot de passe : root)
• Remove anonymous users : Y
• Disallow root login remotely : Y
• Remove test database : Y
• Reload privilege tables : Y`,
            },
          ],
        },
        {
          id: 2,
          title: "Installation GLPI",
          icon: "⚙️",
          content: [
            {
              type: "step",
              title: "a. Extensions PHP requises",
              commands: [
                "apt install php-{ldap,apcu,xmlrpc,mysql,mbstring,curl,gd,xml,intl,bz2,zip} -y",
                "systemctl restart apache2",
              ],
              note: `Extensions nécessaires : curl, fileinfo, gd, json, mbstring, mysqli, session, zlib, simplexml, xml, intl.
Configurer php.ini :
memory_limit = 64M
file_uploads = on
max_execution_time = 600
session.auto_start = off`,
            },
            {
              type: "step",
              title: "b. Création de la base de données",
              commands: [
                "mysql -u root",
                "CREATE DATABASE dbglpi;",
                "GRANT ALL PRIVILEGES ON dbglpi.* TO userglpi@'localhost' IDENTIFIED BY 'userglpi';",
                "FLUSH PRIVILEGES;",
              ],
            },
            {
              type: "step",
              title: "c. Téléchargement et installation",
              commands: [
                "mkdir tmp && cd tmp",
                "wget https://github.com/glpi-project/glpi/releases/download/10.0.5/glpi-10.0.5.tgz",
                "tar xzf glpi-10.0.5.tgz -C /var/www/html",
                "chown -R www-data:www-data /var/www/html/glpi",
                "chmod -R 775 /var/www/html/glpi/",
              ],
              note: "Activer session.cookie_httponly = on dans php.ini, puis accéder à http://votre_ip/glpi pour finaliser l'installation via l'interface web.",
            },
            {
              type: "info",
              title: "Identifiants par défaut après installation",
              items: [
                "glpi / glpi — Administrateur",
                "tech / tech — Technicien",
                "normal / normal — Utilisateur normal",
                "post-only / postonly — Post-only",
              ],
            },
          ],
        },
        {
          id: 3,
          title: "Sécurisation",
          icon: "🔒",
          content: [
            {
              type: "step",
              title: "a. Accès via nom de domaine",
              text: "Créer un enregistrement DNS de type A sur le serveur DNS, puis configurer un Virtual Host Apache.",
              commands: ["cd /etc/apache2/sites-available", "vim glpi.conf"],
              note: `Contenu du fichier glpi.conf :
<VirtualHost *:80>
  ServerName glpi.sitka.local
  DocumentRoot /var/www/glpi
</VirtualHost>`,
            },
            {
              type: "step",
              title: "b. Masquer version et OS",
              text: "Modifier /etc/apache2/conf-enabled/security.conf pour commenter les lignes suivantes :",
              commands: ["vim /etc/apache2/conf-enabled/security.conf"],
              note: "Commenter : ServerTokens OS → #ServerTokens OS\nCommenter : ServerSignature On → #ServerSignature On\npuis redémarrer Apache.",
            },
            {
              type: "step",
              title: "c. Sécurisation SSL",
              commands: [
                "apt install ssl-cert -y",
                "make-ssl-cert /usr/share/ssl-cert/ssleay.cnf /etc/ssl/private/sitka.pem",
                "a2enmod ssl",
                "a2ensite glpi.conf",
                "systemctl reload apache2",
              ],
              note: "Configurer le VirtualHost sur le port 443 avec SSLEngine on et SSLCertificateFile /etc/ssl/private/sitka.pem",
            },
          ],
        },
        {
          id: 4,
          title: "Active Directory",
          icon: "🗂️",
          content: [
            {
              type: "step",
              title: "a. Création de l'UO et des utilisateurs",
              text: "Sur le contrôleur de domaine, créer une Unité d'Organisation (ex : 'rh') contenant les utilisateurs à synchroniser (ex : kaiser, cesar).",
            },
            {
              type: "step",
              title: "b. Configuration LDAP dans GLPI",
              text: "Aller dans Configuration → Authentification → Annuaire LDAP → Ajouter",
              note: `Paramètres LDAP :
• Nom : hermes.sitka.local
• Serveur : 172.20.0.14 | Port : 389
• Filtre de connexion :
  (&(objectClass=user)(objectCategory=person)(!(userAccountControl:1.2.840.113556.1.4.803:=2)))
• BaseDN : OU=rh,DC=sitka,DC=local
• DN du compte : CN=Administrateur,CN=Users,DC=sitka,DC=local
• Champ identifiant : samaccountname
• Champ synchronisation : objectguid`,
            },
            {
              type: "step",
              title: "Importation des utilisateurs",
              text: "Administration → Utilisateurs → Liaison annuaire LDAP → Importation de nouveaux utilisateurs → Rechercher → Cocher → Action → Importer → Envoyer",
            },
          ],
        },
        {
          id: 5,
          title: "Tickets",
          icon: "🎫",
          content: [
            {
              type: "step",
              title: "a. Notification par mail",
              text: "Tester l'envoi SMTP via Telnet, puis configurer les notifications dans GLPI.",
              commands: ["telnet xmail.sitka.local 25"],
              note: `Dans GLPI : Configuration → Notifications
1. Activer le suivi
2. Activer les notifications par courriel
3. Configurer le serveur SMTP (mode SMTP, serveur xmail.sitka.local)
4. Renseigner le mail du compte glpi (support@xmail.sitka.local)`,
            },
            {
              type: "step",
              title: "b. Notification par collecteurs",
              text: "Les collecteurs créent des tickets automatiquement depuis les emails reçus.",
              note: `Configuration → Collecteurs → Ajouter :
• Nom : assistance@xmail.sitka.local
• Protocole : IMAP/SSL
• Serveur : xmail.sitka.local
• Port : 993

Pour collecter : Configuration → Actions automatiques → mailgate → Exécuter`,
            },
            {
              type: "step",
              title: "c. Gestion des tickets",
              text: "Les tickets peuvent être créés manuellement par les utilisateurs ou automatiquement via les collecteurs. L'administrateur est notifié par email à chaque nouveau ticket.",
            },
          ],
        },
        {
          id: 6,
          title: "FusionInventory",
          icon: "🔍",
          content: [
            {
              type: "step",
              title: "a. Installation du plugin",
              commands: [
                "wget https://github.com/fusioninventory/fusioninventory-for-glpi/releases/download/glpi10.0.3%2B1.0/fusioninventory-10.0.3+1.0.tar.bz2",
                "tar xvf fusioninventory-10.0.3+1.0.tar.bz2",
                "mv fusioninventory /var/www/glpi/plugins/",
              ],
              note: "Dans GLPI : Configuration → Plugins → Installer puis Activer FusionInventory",
            },
            {
              type: "step",
              title: "Configurer Cron",
              commands: ["crontab -u www-data -e"],
              note: "Ajouter à la fin du fichier cron :\n* * * * * cd /var/www/glpi/front/ && /usr/bin/php cron.php &>/dev/null\nPuis : /etc/init.d/cron restart",
            },
            {
              type: "step",
              title: "b. Agent FusionInventory Linux",
              commands: ["apt install fusioninventory-agent -y", "vim /etc/fusioninventory/agent.cfg"],
              note: "Dans agent.cfg, configurer :\nserver = https://glpi.sitka.local/plugins/fusioninventory/",
            },
            {
              type: "info",
              title: "Agent Windows",
              items: [
                "Télécharger fusioninventory-agent_windows-x64_2.6.exe sur GitHub",
                "Lancer l'installeur et sélectionner les composants souhaités",
                "Configurer l'URL du serveur GLPI lors de l'installation",
                "L'agent s'installe comme service Windows",
              ],
            },
          ],
        },
      ];

      const state = { page: "cover", active: 0 };
      const app = document.getElementById("app");

      function el(tag, attrs = {}, children = []) {
        const node = document.createElement(tag);
        for (const [k, v] of Object.entries(attrs)) {
          if (v === null || v === undefined) continue;
          if (k === "class") node.className = v;
          else if (k === "text") node.textContent = v;
          else if (k === "disabled") node.disabled = Boolean(v);
          else if (k.startsWith("on") && typeof v === "function") node.addEventListener(k.slice(2).toLowerCase(), v);
          else node.setAttribute(k, v);
        }
        for (const child of children) node.appendChild(child);
        return node;
      }

      function render() {
        app.innerHTML = "";
        if (state.page === "cover") app.appendChild(renderCover());
        else app.appendChild(renderTutorial());
        window.scrollTo({ top: 0, behavior: "instant" });
      }

      function renderCover() {
        const inner = el("div", { class: "cover-inner" }, [
          el("div", { class: "badge" }, [el("span", { text: "🖥️" }), el("span", { text: "Documentation Technique" })]),
          el("h1", { class: "glpi-title", text: "GLPI" }),
          el("div", { class: "glpi-sub", text: "Gestionnaire Libre de Parc Informatique" }),
          el("div", { class: "glpi-desc", text: "Guide complet d'installation, configuration et sécurisation — du serveur LAMP à FusionInventory" }),
          renderCoverPills(),
          el(
            "button",
            {
              class: "primary-btn",
              text: "Commencer le tutoriel →",
              onclick: () => {
                state.page = "tutorial";
                render();
              },
            },
            []
          ),
          el("div", { class: "tiny", text: `${chapters.length} chapitres · Guide complet` }),
        ]);

        return el("div", { class: "cover" }, [el("div", { class: "grid" }), el("div", { class: "orb" }), inner]);
      }

      function renderCoverPills() {
        const row = el("div", { class: "pill-row" }, []);
        for (const ch of chapters) {
          row.appendChild(el("div", { class: "pill" }, [el("span", { text: ch.icon }), el("span", { text: ch.title })]));
        }
        return row;
      }

      function renderTutorial() {
        const sidebar = el("div", { class: "sidebar" }, [renderSidebarHeader(), renderNav(), renderProgress()]);
        const content = el("div", { class: "content" }, [renderChapterHeader(), ...renderBlocks(), renderNavButtons()]);
        return el("div", { class: "tutorial" }, [sidebar, content]);
      }

      function renderSidebarHeader() {
        return el("div", { class: "sidebar-header" }, [
          el("div", { class: "logo" }, [el("div", { class: "logo-badge", text: "G" }), el("div", { class: "logo-text", text: "GLPI" })]),
          el("button", {
            class: "ghost-btn",
            text: "← Accueil",
            onclick: () => {
              state.page = "cover";
              render();
            },
          }),
        ]);
      }

      function renderNav() {
        const nav = el("div", { class: "nav" }, [el("div", { class: "nav-label", text: "Chapitres" })]);
        for (const ch of chapters) {
          const btn = el(
            "button",
            {
              class: `nav-item ${state.active === ch.id ? "active" : ""}`,
              onclick: () => {
                state.active = ch.id;
                render();
              },
            },
            [el("span", { text: ch.icon }), el("span", { text: ch.title })]
          );
          if (state.active === ch.id) btn.appendChild(el("span", { class: "dot", text: "●" }));
          nav.appendChild(btn);
        }
        return el("nav", {}, [nav]);
      }

      function renderProgress() {
        const pct = ((state.active + 1) / chapters.length) * 100;
        return el("div", { class: "progress" }, [
          el("div", { class: "progress-text", text: `PROGRESSION — ${state.active + 1}/${chapters.length}` }),
          el("div", { class: "progress-bar" }, [el("div", { style: `width:${pct}%` })]),
        ]);
      }

      function renderChapterHeader() {
        const chapter = chapters[state.active];
        return el("div", { class: "chapter-header" }, [
          el("div", { class: "chapter-top" }, [
            el("div", { class: "chapter-icon", text: chapter.icon }),
            el("div", {}, [
              el("div", { class: "chapter-kicker", text: `Chapitre ${state.active + 1}` }),
              el("h2", { class: "chapter-title", text: chapter.title }),
            ]),
          ]),
          el("div", { class: "chapter-sep" }),
        ]);
      }

      function renderBlocks() {
        const chapter = chapters[state.active];
        const blocks = [];
        for (const block of chapter.content) {
          if (block.type === "intro") blocks.push(el("div", { class: "block-intro", text: block.text }));
          else if (block.type === "features") blocks.push(renderFeatures(block));
          else if (block.type === "info") blocks.push(renderInfo(block));
          else if (block.type === "step") blocks.push(renderStep(block));
        }
        return blocks;
      }

      function renderFeatures(block) {
        const grid = el("div", { class: "grid-2" }, []);
        for (const item of block.items) {
          grid.appendChild(el("div", { class: "feature-item" }, [el("span", { class: "check", text: "✓" }), el("span", { text: item })]));
        }
        return el("div", { style: "margin-bottom:28px" }, [el("div", { class: "block-h3", text: block.title }), grid]);
      }

      function renderInfo(block) {
        const box = el("div", { class: "info" }, [el("div", { class: "info-title" }, [el("span", { text: "ℹ️" }), el("span", { text: block.title })])]);
        for (const item of block.items) {
          box.appendChild(el("div", { class: "info-item" }, [el("span", { class: "info-dot", text: "•" }), el("span", { text: item })]));
        }
        return box;
      }

      function renderStep(block) {
        const wrap = el("div", { class: "step" }, [
          el("div", { class: "step-head" }, [el("div", { class: "step-dot" }), el("h3", { class: "step-title", text: block.title })]),
        ]);
        const body = el("div", { class: "step-body" }, []);
        if (block.text) body.appendChild(el("p", { class: "step-text", text: block.text }));
        if (block.commands) {
          for (const cmd of block.commands) {
            const cmdRow = el("div", { class: "cmd" }, [el("span", { class: "cmd-hash", text: "#" }), el("span", { text: cmd })]);
            body.appendChild(cmdRow);
          }
        }
        if (block.note) {
          body.appendChild(
            el("div", { class: "note" }, [el("div", { class: "note-kicker", text: "Note" }), el("pre", { text: block.note })])
          );
        }
        wrap.appendChild(body);
        return wrap;
      }

      function renderNavButtons() {
        const prev = el("button", {
          class: "navbtn",
          text: "← Précédent",
          disabled: state.active === 0,
          onclick: () => {
            if (state.active === 0) return;
            state.active = Math.max(0, state.active - 1);
            render();
          },
        });

        const next = el("button", {
          class: "navbtn primary",
          text: "Suivant →",
          disabled: state.active === chapters.length - 1,
          onclick: () => {
            if (state.active === chapters.length - 1) return;
            state.active = Math.min(chapters.length - 1, state.active + 1);
            render();
          },
        });

        return el("div", { class: "nav-buttons" }, [prev, next]);
      }

      render();
    </script>
  </body>
</html>
